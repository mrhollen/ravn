# ravn — compose stack (slice 6, ARCHITECTURE §8).
#
# One Dockerfile, two build targets (see Dockerfile stage comments). The
# SQLite database lives in the named volume `ravn-data` so it survives
# container rebuilds/restarts; keep that volume on a local disk — never bind
# mount it from NFS/CIFS (WAL misbehaves there).
#
# Host-side ports are overridable via .env (copied from .env.example) or the
# environment — compose interpolates ${VAR:-default} automatically:
#   RAVN_BIND_IP       default 127.0.0.1 (loopback; set to 0.0.0.0 only with RAVN_TOKEN set!)
#   RAVN_SERVER_PORT   default 3311   (ravn-server publishes :8080 inside)
#   RAVN_MCP_PORT      default 9311   (ravn-mcp    publishes :9080 inside)
#   RAVN_DATA_DIR      default ravn-data (named volume; set to e.g. ./data for host bind mount)
#   RAVN_ARTIFACTS_DIR default ravn-artifacts (named volume; set to e.g. ./artifacts for host bind mount)
# Containers ALWAYS listen on 8080/9080 internally; only the host mapping
# changes, which keeps the MCP container's upstream URL stable.

services:
  ravn-server:
    image: ${RAVN_IMAGE:-ravn:latest}
    build:
      context: .
      target: server-runtime
    ports:
      - "${RAVN_BIND_IP:-127.0.0.1}:${RAVN_SERVER_PORT:-3311}:8080"
    environment:
      RAVN_ADDR: ":8080"
      RAVN_DATA: "/data/ravn.db"
      RAVN_STATIC_DIR: "/app/public" # UI is baked into the image (web-build stage)
      RAVN_ARTIFACTS_DIR: "/artifacts"
      RAVN_TOKEN: "${RAVN_TOKEN:-}" # optional; empty = auth off (single-tenant local default)
      OPENCODE_MODEL: "${OPENCODE_MODEL:-}" # optional; empty = use the OpenCode server's default model
      OPENCODE_ALLOW_PRIVATE_IPS: "${OPENCODE_ALLOW_PRIVATE_IPS:-true}" # allow LAN/private IP addresses (e.g. 10.x.x.x, 192.168.x.x, localhost)
      OPENCODE_ALLOWED_HOSTS: "${OPENCODE_ALLOWED_HOSTS:-}" # optional explicit host allowlist (comma-separated, CIDR, or *)
      OPENCODE_SERVER_URL: "${OPENCODE_SERVER_URL:-}" # OpenCode server base URL; empty = built-in default
      OPENCODE_DIRECTORY: "${OPENCODE_DIRECTORY:-}"   # session working directory; empty = built-in default
    volumes:
      - "${RAVN_DATA_DIR:-ravn-data}:/data"
      - "${RAVN_ARTIFACTS_DIR:-ravn-artifacts}:/artifacts"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      start_period: 10s # first boot runs SQL migrations
      retries: 3

  ravn-mcp:
    image: ${RAVN_IMAGE:-ravn:latest}
    entrypoint: ["ravn-mcp"]
    build:
      context: .
      target: server-runtime
    ports:
      - "${RAVN_BIND_IP:-127.0.0.1}:${RAVN_MCP_PORT:-9311}:9080"
    environment:
      MCP_ADDR: ":9080"
      RAVN_API_URL: "http://ravn-server:8080" # compose service DNS — no IPs, no host assumptions
      RAVN_TOKEN: "${RAVN_TOKEN:-}" # forwarded as Bearer to the API when set
      RAVN_AGENT_NAME: "${RAVN_AGENT_NAME:-agent}" # actor stamped when a tool call omits one
    depends_on:
      ravn-server:
        condition: service_healthy # mcp /healthz proxies upstream, so it only turns healthy once the server (and its DB) do
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9080/healthz"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  ravn-data:
  ravn-artifacts:
