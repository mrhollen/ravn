<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Rävn Sample 2 — Nordic Heraldic Soaring Raven Crest">
  <defs>
    <!-- Deep Midnight Obsidian Sky -->
    <linearGradient id="bg2" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <!-- Runic Ring Gradient -->
    <linearGradient id="crestRing" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Main Soaring Raven Plumage (Luminous Silver-White to Cool Slate) -->
    <linearGradient id="ravenMain" x1="256" y1="72" x2="256" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Secondary Inner Wing Layer (Electric Indigo) -->
    <linearGradient id="wingIndigo" x1="100" y1="200" x2="412" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <!-- Amber-Coral Nordic Sun & Umlaut Accent -->
    <linearGradient id="amberAccent" x1="200" y1="60" x2="312" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <filter id="glow2" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- App Icon Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg2)"/>

  <!-- Nordic Runic Outer Ring & Inner Dashed Orbit -->
  <circle cx="256" cy="256" r="198" fill="none" stroke="url(#crestRing)" stroke-width="4" opacity="0.85"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#312E81" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.7"/>

  <g filter="url(#glow2)">
    <!-- LAYER 3 (Back): Sweeping Indigo Secondary Wing Pinions (Fanned Blade Feathers) -->
    <path d="
      M 256,220
      L 428,186 C 422,226 394,254 352,264
      L 404,258 C 392,292 362,314 320,318
      L 364,322 C 348,350 318,364 282,362
      L 256,340
      L 230,362 C 194,364 164,350 148,322
      L 192,318 C 150,314 120,292 108,258
      L 160,264 C 118,254 90,226 84,186
      Z
    " fill="url(#wingIndigo)"/>

    <!-- LAYER 2 (Main): Soaring Silver-White Raven Silhouette (Head, Beak, Primary Swept Wings, Fanned Tail) -->
    <path d="
      M 256,70
      L 276,120
      C 284,140 304,154 330,156
      C 378,160 422,140 450,108
      C 444,166 408,210 352,224
      L 288,240
      L 310,404
      C 312,418 300,428 286,422
      L 256,406
      L 226,422
      C 212,428 200,418 202,404
      L 224,240
      L 160,224
      C 104,210 68,166 62,108
      C 90,140 134,160 182,156
      C 208,154 228,140 236,120
      Z
    " fill="url(#ravenMain)"/>

    <!-- LAYER 1 (Details): Beak Ridge, Eyes, and Nordic Runic Heart Core on the Raven's Chest -->
    <!-- Beak Center Culmen Split -->
    <polygon points="256,70 265,124 256,140 247,124" fill="#0F172A"/>

    <!-- Fierce Angled Eyes -->
    <polygon points="228,132 244,138 234,146" fill="#EA580C"/>
    <polygon points="284,132 268,138 278,146" fill="#EA580C"/>

    <!-- Glowing Runic Diamond Core on Chest (3 Interlocking Facets = Coordination / Kanban States) -->
    <polygon points="256,176 286,218 256,260 226,218" fill="#0F172A"/>
    <polygon points="256,186 278,218 256,250 234,218" fill="url(#amberAccent)"/>

    <!-- Tail Feather Splits -->
    <line x1="256" y1="286" x2="256" y2="406" stroke="#0F172A" stroke-width="5" stroke-linecap="round"/>
    <line x1="234" y1="300" x2="224" y2="412" stroke="#0F172A" stroke-width="4" stroke-linecap="round"/>
    <line x1="278" y1="300" x2="288" y2="412" stroke="#0F172A" stroke-width="4" stroke-linecap="round"/>

    <!-- Umlaut (ä) — Two Glowing Golden Orbs Flanking the Crown (Huginn & Muninn) -->
    <circle cx="206" cy="96" r="11" fill="url(#amberAccent)"/>
    <circle cx="306" cy="96" r="11" fill="url(#amberAccent)"/>
  </g>
</svg>
