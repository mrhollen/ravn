name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ci:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: go.sum

      - name: Check formatting (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not formatted with gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Check linting (go vet)
        run: go vet ./...

      - name: Run Go tests
        run: go test -race ./...

      - name: Build static binaries
        run: |
          CGO_ENABLED=0 go build -trimpath -o bin/ravn-server ./cmd/ravn-server
          CGO_ENABLED=0 go build -trimpath -o bin/ravn-mcp ./cmd/ravn-mcp

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # This key ensures the cache invalidates if you update Playwright in your package-lock.json
          key: ${{ runner.os }}-playwright-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: "Pre-flight: repair apt/dpkg state"
        run: |
          # Reused runner containers can carry a half-configured dpkg state from an
          # interrupted package install; fix it before Playwright's apt step runs.
          export DEBIAN_FRONTEND=noninteractive
          SUDO=""
          if [ "$(id -u)" != "0" ] && command -v sudo >/dev/null 2>&1; then
            SUDO="sudo"
          fi
          $SUDO apt-get update || true
          if ! $SUDO dpkg --configure -a || [ -n "$($SUDO dpkg --audit 2>/dev/null)" ]; then
            echo "Broken dpkg state detected, repairing..."
            $SUDO apt-get install -f -y
            $SUDO dpkg --configure -a
          fi

      - name: Build web application and install Playwright dependencies
        run: |
          cd web
          npm ci

          SUDO=""
          if [ "$(id -u)" != "0" ] && command -v sudo >/dev/null 2>&1; then
            SUDO="sudo"
          fi

          echo "Starting web build and Playwright install concurrently..."
          npm run build &
          BUILD_PID=$!

          PW_PID=""
          if ! command -v chromium >/dev/null 2>&1 && ! command -v chromium-browser >/dev/null 2>&1; then
            # Install system deps (apt) separately from the browser download so a
            # package failure surfaces with apt's own error output.
            { npx playwright install-deps chromium && npx playwright install chromium; } &
            PW_PID=$!
          fi

          FAILED=0
          if [ -n "$PW_PID" ]; then
            wait "$PW_PID" || FAILED=1
          fi
          wait "$BUILD_PID" || FAILED=1

          if [ "$FAILED" -ne 0 ]; then
            echo "Frontend build or Playwright dependency installation failed."
            echo "--- dpkg audit ---"
            $SUDO dpkg --audit 2>/dev/null || true
            echo "--- apt term log (tail) ---"
            tail -n 40 /var/log/apt/term.log 2>/dev/null || true
            exit 1
          fi

      - name: Run web unit tests
        run: |
          cd web
          npm run test:unit

      - name: Run browser E2E tests
        run: |
          cd web
          npm run test:e2e

      - name: Validate Docker Compose configuration
        run: |
          if command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then
            echo "Validating docker-compose.yml..."
            docker compose -f docker-compose.yml config > /dev/null
            echo "Validating docker-compose-v3.3.yml..."
            docker compose -f docker-compose-v3.3.yml config > /dev/null
            echo "Docker Compose configurations are valid."
          elif command -v docker-compose >/dev/null 2>&1; then
            echo "Validating docker-compose.yml with docker-compose..."
            docker-compose -f docker-compose.yml config > /dev/null
            echo "Validating docker-compose-v3.3.yml with docker-compose..."
            docker-compose -f docker-compose-v3.3.yml config > /dev/null
            echo "Docker Compose configurations are valid."
          else
            echo "Docker Compose is not available in runner environment; skipping."
          fi

      - name: Build container images (multi-stage)
        run: |
          if command -v docker >/dev/null 2>&1; then
            echo "Building image target: server-runtime..."
            docker build --target server-runtime -t test-server .
            echo "Building image target: mcp-runtime..."
            docker build --target mcp-runtime -t test-mcp .
            echo "Both image targets built successfully."
          else
            echo "Docker is not available in runner environment; skipping image build."
          fi

  publish:
    name: Build and Push Image
    needs: ci
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.REGISTRY_HOST != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and push container image to Forgejo
        env:
          PUSH_TOKEN: ${{ secrets.PACKAGE_TOKEN || secrets.FORGEJO_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # Registry host + full image ref come from repository variables (set on the
          # Forgejo repo). If REGISTRY_IMAGE is unset, derive it from the registry and
          # the lowercased repository name.
          REGISTRY="${{ vars.REGISTRY_HOST }}"
          IMAGE_NAME="${{ vars.REGISTRY_IMAGE }}"
          if [ -z "$IMAGE_NAME" ]; then
            REPO="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
            IMAGE_NAME="${REGISTRY}/${REPO}:latest"
          fi
          echo "Target image: ${IMAGE_NAME}"

          # Optionally inject a DNS/hosts entry for the registry host. Provide it via the
          # REGISTRY_HOSTS_ENTRY repository *secret* as "<ip> <hostname>", or configure
          # extra_hosts / --add-host=<hostname>:<ip> on the runner instead.
          if [ -n "${{ secrets.REGISTRY_HOSTS_ENTRY }}" ]; then
            HOSTS_ENTRY="${{ secrets.REGISTRY_HOSTS_ENTRY }}"
            REG_HOST="$(echo "$HOSTS_ENTRY" | awk '{print $NF}')"
            grep -qF "$REG_HOST" /etc/hosts || echo "$HOSTS_ENTRY" >> /etc/hosts
          fi

          echo "Installing crane for direct HTTP registry push..."
          curl -sL https://github.com/google/go-containerregistry/releases/download/v0.22.1/go-containerregistry_Linux_x86_64.tar.gz | tar -xz -C /usr/local/bin crane

          echo "Building image (target server-runtime)..."
          docker build --target server-runtime -t ravn:latest .

          echo "Logging in to ${REGISTRY} via crane..."
          echo "${PUSH_TOKEN}" | crane auth login "${REGISTRY}" -u "${{ github.actor }}" --password-stdin --insecure

          echo "Saving image to tarball for crane..."
          docker save ravn:latest -o /tmp/ravn.tar

          echo "Pushing ${IMAGE_NAME} via crane..."
          crane push /tmp/ravn.tar "${IMAGE_NAME}" --insecure
          rm -f /tmp/ravn.tar
          echo "Successfully pushed ${IMAGE_NAME} to the container registry!"
