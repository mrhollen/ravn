name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ci:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: go.sum

      - name: Check formatting (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not formatted with gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Check linting (go vet)
        run: go vet ./...

      - name: Run Go tests
        run: go test -race ./...

      - name: Build static binaries
        run: |
          CGO_ENABLED=0 go build -trimpath -o bin/crowban-server ./cmd/crowban-server
          CGO_ENABLED=0 go build -trimpath -o bin/crowban-mcp ./cmd/crowban-mcp

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # This key ensures the cache invalidates if you update Playwright in your package-lock.json
          key: ${{ runner.os }}-playwright-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Build web application and install Playwright dependencies
        run: |
          cd web
          npm ci

          echo "Starting web build and Playwright install concurrently..."
          npm run build &
          BUILD_PID=$!

          PW_PID=""
          if ! command -v chromium >/dev/null 2>&1 && ! command -v chromium-browser >/dev/null 2>&1; then
            npx playwright install --with-deps chromium &
            PW_PID=$!
          fi

          FAILED=0
          if [ -n "$PW_PID" ]; then
            wait "$PW_PID" || FAILED=1
          fi
          wait "$BUILD_PID" || FAILED=1

          if [ "$FAILED" -ne 0 ]; then
            echo "Frontend build or Playwright dependency installation failed."
            exit 1
          fi

      - name: Run browser E2E tests
        run: |
          cd web
          npm run test:e2e

      - name: Validate Docker Compose configuration
        run: |
          if command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then
            echo "Validating docker-compose.yml..."
            docker compose -f docker-compose.yml config > /dev/null
            echo "Validating docker-compose-v3.3.yml..."
            docker compose -f docker-compose-v3.3.yml config > /dev/null
            echo "Docker Compose configurations are valid."
          elif command -v docker-compose >/dev/null 2>&1; then
            echo "Validating docker-compose.yml with docker-compose..."
            docker-compose -f docker-compose.yml config > /dev/null
            echo "Validating docker-compose-v3.3.yml with docker-compose..."
            docker-compose -f docker-compose-v3.3.yml config > /dev/null
            echo "Docker Compose configurations are valid."
          else
            echo "Docker Compose is not available in runner environment; skipping."
          fi

  publish:
    name: Build and Push Image
    needs: ci
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and push container image to Forgejo
        env:
          PUSH_TOKEN: ${{ secrets.PACKAGE_TOKEN || secrets.FORGEJO_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          REGISTRY="forgejo.lan:80"
          IMAGE_NAME="${REGISTRY}/${{ github.repository }}:latest"
          echo "Target image: ${IMAGE_NAME}"

          # Ensure forgejo.lan resolves to 10.0.0.150 inside the runner container
          grep -q "forgejo.lan" /etc/hosts || echo "10.0.0.150 forgejo.lan" >> /etc/hosts

          echo "Installing crane for direct HTTP registry push..."
          curl -sL https://github.com/google/go-containerregistry/releases/download/v0.22.1/go-containerregistry_Linux_x86_64.tar.gz | tar -xz -C /usr/local/bin crane

          echo "Building image (target server-runtime)..."
          docker build --target server-runtime -t crowban:latest .

          echo "Logging in to ${REGISTRY} via crane..."
          echo "${PUSH_TOKEN}" | crane auth login "${REGISTRY}" -u "${{ github.actor }}" --password-stdin --insecure

          echo "Saving image to tarball for crane..."
          docker save crowban:latest -o /tmp/crowban.tar

          echo "Pushing ${IMAGE_NAME} via crane..."
          crane push /tmp/crowban.tar "${IMAGE_NAME}" --insecure
          rm -f /tmp/crowban.tar
          echo "Successfully pushed ${IMAGE_NAME} to Forgejo container registry!"
