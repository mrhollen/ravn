name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: go.sum

      - name: Check formatting (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not formatted with gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Check linting (go vet)
        run: go vet ./...

      - name: Run Go tests
        run: go test -race ./...

      - name: Build static binaries
        run: |
          CGO_ENABLED=0 go build -trimpath -o bin/ravn-server ./cmd/ravn-server
          CGO_ENABLED=0 go build -trimpath -o bin/ravn-mcp ./cmd/ravn-mcp

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: "Pre-flight: repair apt/dpkg state and reclaim disk space"
        run: |
          # Reused runner containers can carry a half-configured dpkg state from an
          # interrupted package install (e.g. xvfb -> libgl1-mesa-dri -> libllvm15
          # exhausting /tmp or rootfs during unpack); clean up and fix it first.
          export DEBIAN_FRONTEND=noninteractive
          SUDO=""
          if [ "$(id -u)" != "0" ] && command -v sudo >/dev/null 2>&1; then
            SUDO="sudo"
          fi

          # Free disk space from unused SDKs and toolchains if present in runner image
          $SUDO rm -rf \
            /usr/share/dotnet \
            /usr/local/share/powershell \
            /opt/ghc \
            /usr/local/lib/android \
            /usr/local/share/boost \
            2>/dev/null || true

          $SUDO rm -rf /tmp/apt-dpkg-install-* /tmp/playwright* /tmp/*.tar /tmp/*.tzst 2>/dev/null || true
          if command -v docker >/dev/null 2>&1; then
            docker rmi -f test-server test-mcp 2>/dev/null || true
            docker image prune -f 2>/dev/null || true
          fi
          echo "--- Disk space before apt ---"
          df -h / /tmp 2>/dev/null || true
          # Remove any half-unpacked X11/Mesa/LLVM packages from prior install-deps runs;
          # headless Chromium uses its bundled SwiftShader and does not need xvfb or libllvm.
          $SUDO dpkg --remove --force-remove-reinstreq --force-depends \
            xvfb libgl1 libglx0 libglx-mesa0 libgl1-mesa-dri libllvm15 2>/dev/null || true
          $SUDO apt-get update || true
          if ! $SUDO dpkg --configure -a || [ -n "$($SUDO dpkg --audit 2>/dev/null)" ]; then
            echo "Broken dpkg state detected, repairing..."
            $SUDO apt-get install -f -y --no-install-recommends
            $SUDO dpkg --configure -a
          fi
          $SUDO apt-get clean || true

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Cache only the lightweight headless shell to stay well under container disk limits
          key: ${{ runner.os }}-playwright-shell-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-shell-

      - name: Build web application and install Playwright dependencies
        run: |
          cd web
          npm ci

          export DEBIAN_FRONTEND=noninteractive
          SUDO=""
          if [ "$(id -u)" != "0" ] && command -v sudo >/dev/null 2>&1; then
            SUDO="sudo"
          fi

          echo "Starting web build and Playwright install concurrently..."
          npm run build &
          BUILD_PID=$!

          PW_PID=""
          if ! command -v chromium >/dev/null 2>&1 && ! command -v chromium-browser >/dev/null 2>&1; then
            # Install only the headless Chromium shared libraries (skipping Playwright's
            # `tools` bundle of xvfb -> libgl1-mesa-dri -> libllvm15 and 200MB of CJK fonts)
            # and download only chromium-headless-shell.
            {
              PKGS=""
              for p in \
                libasound2 libatk-bridge2.0-0 libatk1.0-0 libatspi2.0-0 libcups2 libglib2.0-0 \
                libcairo2 libdbus-1-3 libdrm2 libgbm1 libnspr4 libnss3 libpango-1.0-0 \
                libwayland-client0 libx11-6 libxcb1 libxcomposite1 libxdamage1 libxext6 \
                libxfixes3 libxkbcommon0 libxrandr2 libfontconfig1 libfreetype6 fonts-liberation; do
                cand_t64="$(apt-cache policy "${p}t64" 2>/dev/null | awk '/Candidate:/ { print $2 }')"
                cand_p="$(apt-cache policy "$p" 2>/dev/null | awk '/Candidate:/ { print $2 }')"
                if [ -n "$cand_t64" ] && [ "$cand_t64" != "(none)" ]; then
                  PKGS="$PKGS ${p}t64"
                elif [ -n "$cand_p" ] && [ "$cand_p" != "(none)" ]; then
                  PKGS="$PKGS $p"
                fi
              done
              $SUDO apt-get install -y --no-install-recommends $PKGS &&
                $SUDO apt-get clean &&
                $SUDO rm -rf /var/lib/apt/lists/* &&
                npx playwright install --only-shell chromium
            } &
            PW_PID=$!
          fi

          FAILED=0
          if [ -n "$PW_PID" ]; then
            wait "$PW_PID" || FAILED=1
          fi
          wait "$BUILD_PID" || FAILED=1

          if [ "$FAILED" -ne 0 ]; then
            echo "Frontend build or Playwright dependency installation failed."
            echo "--- Disk space ---"
            df -h / /tmp 2>/dev/null || true
            echo "--- dpkg audit ---"
            $SUDO dpkg --audit 2>/dev/null || true
            echo "--- apt term log (tail) ---"
            tail -n 100 /var/log/apt/term.log 2>/dev/null || true
            exit 1
          fi

      - name: Run web unit tests
        run: |
          cd web
          npm run test:unit

      - name: Run browser E2E tests
        run: |
          cd web
          npm run test:e2e

      - name: Validate Docker Compose configuration
        run: |
          if command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then
            echo "Validating docker-compose.yml..."
            docker compose -f docker-compose.yml config > /dev/null
            echo "Validating docker-compose-v3.3.yml..."
            docker compose -f docker-compose-v3.3.yml config > /dev/null
            echo "Docker Compose configurations are valid."
          elif command -v docker-compose >/dev/null 2>&1; then
            echo "Validating docker-compose.yml with docker-compose..."
            docker-compose -f docker-compose.yml config > /dev/null
            echo "Validating docker-compose-v3.3.yml with docker-compose..."
            docker-compose -f docker-compose-v3.3.yml config > /dev/null
            echo "Docker Compose configurations are valid."
          else
            echo "Docker Compose is not available in runner environment; skipping."
          fi

      - name: Build container images (multi-stage)
        run: |
          if command -v docker >/dev/null 2>&1; then
            echo "Building image target: server-runtime..."
            docker build --target server-runtime -t test-server .
            echo "Building image target: mcp-runtime..."
            docker build --target mcp-runtime -t test-mcp .
            docker rmi -f test-server test-mcp 2>/dev/null || true
            echo "Both image targets built successfully."
          else
            echo "Docker is not available in runner environment; skipping image build."
          fi
