name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: go.sum

      - name: Check formatting (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not formatted with gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Check linting (go vet)
        run: go vet ./...

      - name: Run Go tests
        run: go test -race ./...

      - name: Build static binaries
        run: |
          CGO_ENABLED=0 go build -trimpath -o bin/ravn-server ./cmd/ravn-server
          CGO_ENABLED=0 go build -trimpath -o bin/ravn-mcp ./cmd/ravn-mcp

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Build web application and install Playwright dependencies
        run: |
          cd web
          npm ci

          echo "Starting web build and Playwright install concurrently..."
          npm run build &
          BUILD_PID=$!

          PW_PID=""
          if ! command -v chromium >/dev/null 2>&1 && ! command -v chromium-browser >/dev/null 2>&1; then
            npx playwright install --with-deps chromium &
            PW_PID=$!
          fi

          FAILED=0
          if [ -n "$PW_PID" ]; then
            wait "$PW_PID" || FAILED=1
          fi
          wait "$BUILD_PID" || FAILED=1

          if [ "$FAILED" -ne 0 ]; then
            echo "Frontend build or Playwright dependency installation failed."
            exit 1
          fi

      - name: Run web unit tests
        run: |
          cd web
          npm run test:unit

      - name: Run browser E2E tests
        run: |
          cd web
          npm run test:e2e

      - name: Upload hero screenshot artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: hero-screenshot
          path: web/test-results/hero.png
          if-no-files-found: error

      - name: Validate Docker Compose configuration
        run: |
          if command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then
            echo "Validating docker-compose.yml..."
            docker compose -f docker-compose.yml config > /dev/null
            echo "Validating docker-compose-v3.3.yml..."
            docker compose -f docker-compose-v3.3.yml config > /dev/null
            echo "Docker Compose configurations are valid."
          elif command -v docker-compose >/dev/null 2>&1; then
            echo "Validating docker-compose.yml with docker-compose..."
            docker-compose -f docker-compose.yml config > /dev/null
            echo "Validating docker-compose-v3.3.yml with docker-compose..."
            docker-compose -f docker-compose-v3.3.yml config > /dev/null
            echo "Docker Compose configurations are valid."
          else
            echo "Docker Compose is not available in runner environment; skipping."
          fi

      - name: Build container images (multi-stage)
        run: |
          if command -v docker >/dev/null 2>&1; then
            echo "Building image target: server-runtime..."
            docker build --target server-runtime -t test-server .
            echo "Building image target: mcp-runtime..."
            docker build --target mcp-runtime -t test-mcp .
            echo "Both image targets built successfully."
          else
            echo "Docker is not available in runner environment; skipping image build."
          fi

  upload-hero-screenshot:
    name: Publish Hero Screenshot (GitHub mirror)
    needs: ci
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.ci.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download hero screenshot artifact
        uses: actions/download-artifact@v4
        with:
          name: hero-screenshot
          path: .

      - name: Publish hero screenshot as a pinned release asset (overwrite)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set +e
          TAG="screenshot"
          ASSET="hero.png"
          HERO="web/test-results/hero.png"
          if [ ! -f "$HERO" ]; then
            echo "Hero screenshot artifact missing; nothing to publish. Skipping cleanly."
            exit 0
          fi
          # Create the pinned release once (idempotent).
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Creating pinned release '$TAG'..."
            gh release create "$TAG" \
              --title "Hero Screenshot (auto-updated)" \
              --notes "Auto-refreshed from the E2E suite on every green push to main. Do not edit manually." \
              >/dev/null 2>&1 || echo "::warning::Could not create release '$TAG' (insufficient token permission?)."
          fi
          # Overwrite the fixed-named asset so the public download URL never changes.
          if gh release upload "$TAG" "$HERO" --clobber; then
            echo "Published hero screenshot: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ASSET}"
          else
            echo "::warning::Hero upload failed (insufficient token permission?). Skipping cleanly - no side effects."
          fi
          exit 0
